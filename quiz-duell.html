<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Fragenfuchs</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         background:#0f1020; color:#9298c4; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  a { color:#7aa2ff; }
</style>
</head>
<body>
<p>Fragenfuchs ist umgezogen … <a id="w" href="./">hier geht es weiter</a></p>
<script>
/* Alte Adresse. Leitet auf die neue kurze Adresse weiter und nimmt
   dabei den Teil hinter dem # mit – sonst gingen alle bereits
   verschickten Challenge- und Einladungs-Links verloren.        */
(function () {
  var ziel = "./" + (location.search || "") + (location.hash || "");
  document.getElementById("w").href = ziel;
  location.replace(ziel);
})();
</script>
</body>
</html>
